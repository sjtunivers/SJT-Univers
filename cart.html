<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow - Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    .cart-item {
      border: 1px solid #49390e;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
    }
    .cart-item button, .checkout-btn {
      background: #ffcc33;
      color: #111;
      border: 0;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }
    .cart-total { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">ShopNow</a>
    <a href="products.html">Continue Shopping</a>
  </header>  <main>
    <h1>My Shopping Cart</h1>
    <div id="cartItems"></div>
    <p id="emptyCart">Your cart is empty.</p>
    <p class="cart-total">Total: ₹<span id="cartTotal">0</span></p>
    <button class="checkout-btn" onclick="goCheckout()">Proceed to Checkout</button>
  </main>  <script>
    function getCart() {
      try {
        return JSON.parse(localStorage.getItem("shopnow_cart") || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem("shopnow_cart", JSON.stringify(cart));
    }

    function renderCart() {
      const cart = getCart();
      const box = document.getElementById("cartItems");
      box.innerHTML = "";
      let total = 0;

      document.getElementById("emptyCart").style.display =
        cart.length ? "none" : "block";

      cart.forEach((item, index) => {
        const price = Number(item.price) || 0;
        const qty = Number(item.quantity) || 1;
        total += price * qty;

        const div = document.createElement("div");
        div.className = "cart-item";

        const name = document.createElement("h3");
        name.textContent = item.name || "Product";
        const detail = document.createElement("p");
        detail.textContent = "Price: ₹" + price + " × " + qty;
        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.onclick = () => {
          const updated = getCart();
          updated.splice(index, 1);
          saveCart(updated);
          renderCart();
        };

        div.append(name, detail, remove);
        box.appendChild(div);
      });

      document.getElementById("cartTotal").textContent = total;
    }

    function goCheckout() {
      if (!getCart().length) {
        alert("Your cart is empty.");
        return;
      }
      window.location.href = "checkout.html";
    }

    renderCart();
  </script></body>
</html>
