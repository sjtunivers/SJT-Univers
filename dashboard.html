<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShopNow Admin Dashboard</title>

<style>
*{
 box-sizing:border-box;
 font-family:Arial,sans-serif;
}

body{
 margin:0;
 background:#050505;
 color:white;
}

header{
 background:#101010;
 border-bottom:1px solid #f5c542;
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:24px;
 font-weight:bold;
}

.logo span{
 color:#f5c542;
}

.logout{
 background:#f5c542;
 border:0;
 padding:9px 15px;
 border-radius:5px;
 font-weight:bold;
}

.container{
 width:94%;
 max-width:1400px;
 margin:25px auto;
}

h1{
 margin-bottom:20px;
}

.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
}

.card{
 background:#111;
 border:1px solid #49390e;
 border-radius:10px;
 padding:20px;
}

.card b{
 display:block;
 color:#f5c542;
 font-size:26px;
 margin-top:8px;
}

.orders{
 margin-top:25px;
}

.table-box{
 overflow-x:auto;
}

table{
 width:100%;
 min-width:900px;
 border-collapse:collapse;
}

th,td{
 padding:12px;
 border-bottom:1px solid #333;
 text-align:left;
}

th{
 color:#f5c542;
 background:#181818;
}

.status{
 padding:5px 8px;
 border-radius:4px;
 background:#3d3210;
 color:#f5c542;
}

select{
 background:#111;
 color:white;
 border:1px solid #555;
 padding:6px;
 border-radius:4px;
}

.empty{
 text-align:center;
 color:#777;
 padding:30px;
}

@media(max-width:800px){
 .cards{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:500px){
 .cards{
  grid-template-columns:1fr 1fr;
 }
}
</style>
</head>

<body>

<header>

<div class="logo">
Shop<span>Now</span> Admin
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</header>

<div class="container">

<h1>📊 Admin Dashboard</h1>

<div class="cards">

<div class="card">
📦 Total Orders
<b id="orders">0</b>
</div>

<div class="card">
👥 Customers
<b id="customers">0</b>
</div>

<div class="card">
💰 Total Sales
<b id="sales">₹0</b>
</div>

<div class="card">
⏳ Pending
<b id="pending">0</b>
</div>

</div>

<div class="card orders">

<h2>📦 Customer Orders</h2>

<div class="table-box">

<table>

<thead>

<tr>
<th>Order</th>
<th>Customer</th>
<th>Mobile</th>
<th>Address</th>
<th>Product</th>
<th>Qty</th>
<th>Amount</th>
<th>Payment</th>
<th>Status</th>
</tr>

</thead>

<tbody id="orderList">

</tbody>

</table>

</div>

</div>

</div>

<script>

if(
sessionStorage.getItem("shop_admin_login")
!=="true"
){

window.location.href="admin.html";

}


function logout(){

sessionStorage.removeItem(
"shop_admin_login"
);

window.location.href="admin.html";

}


function loadOrders(){

let orders =
JSON.parse(
localStorage.getItem("shopnow_orders")
||"[]"
);

document.getElementById("orders").innerText =
orders.length;

document.getElementById("customers").innerText =
orders.length;

let total=0;
let pending=0;

orders.forEach(order=>{

total += Number(order.total||0);

if(
(order.status||"Pending")
==="Pending"
){
pending++;
}

});


document.getElementById("sales").innerText =
"₹"+total;

document.getElementById("pending").innerText =
pending;


const box =
document.getElementById("orderList");

box.innerHTML="";


if(orders.length===0){

box.innerHTML=`
<tr>
<td colspan="9">
<div class="empty">
📦 Abhi koi order nahi hai
</div>
</td>
</tr>
`;

return;

}


orders.forEach((order,index)=>{

box.innerHTML += `

<tr>

<td>
#${order.id||index+1}
</td>

<td>
${order.name||"Customer"}
</td>

<td>
${order.mobile||order.phone||"-"}
</td>

<td>
${order.address||"-"}
<br>
${order.city||""}
${order.state||""}
${order.pincode||""}
</td>

<td>
${order.product||order.productName||"-"}
</td>

<td>
${order.quantity||order.qty||1}
</td>

<td>
₹${order.total||0}
</td>

<td>
${order.payment||"COD"}
</td>

<td>

<select
onchange="changeStatus(${index},this.value)"
>

<option
${(order.status||"Pending")
==="Pending"?"selected":""}>
Pending
</option>

<option
${order.status==="Shipped"?"selected":""}>
Shipped
</option>

<option
${order.status==="Delivered"?"selected":""}>
Delivered
</option>

<option
${order.status==="Cancelled"?"selected":""}>
Cancelled
</option>

</select>

</td>

</tr>

`;

});

}


function changeStatus(index,status){

let orders =
JSON.parse(
localStorage.getItem("shopnow_orders")
||"[]"
);

if(orders[index]){

orders[index].status=status;

localStorage.setItem(
"shopnow_orders",
JSON.stringify(orders)
);

loadOrders();

}

}


loadOrders();

</script>

</body>
</html>
