<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopNow Admin Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-box{
    width:90%;
    max-width:380px;
    background:#111;
    border:1px solid #f5c542;
    border-radius:12px;
    padding:30px;
    box-sizing:border-box;
}

.login-box h1{
    text-align:center;
    color:#f5c542;
}

.login-box p{
    text-align:center;
    color:#aaa;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-top:10px;
    margin-bottom:15px;
    box-sizing:border-box;
    background:#222;
    border:1px solid #555;
    color:white;
    border-radius:5px;
}

.login-box button{
    width:100%;
    padding:13px;
    background:#f5c542;
    border:0;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
}

.error{
    color:#ff5555;
    text-align:center;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Admin Login</h1>

    <p>ShopNow Admin Panel</p>

    <input
        type="password"
        id="adminPassword"
        placeholder="Enter Admin Password"
    >

    <button onclick="adminLogin()">
        Login
    </button>

    <div class="error" id="error"></div>

</div>

<script>

function adminLogin(){

    const password =
    document.getElementById("adminPassword").value;

    if(password === "SJT@12345"){

        sessionStorage.setItem(
            "shop_admin_login",
            "true"
        );

        window.location.href = "dashboard.html";

    }else{

        document.getElementById("error").innerText =
        "❌ Wrong Password";

    }

}

</script>

</body>
</html>
